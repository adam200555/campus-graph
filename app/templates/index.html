<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Graph</title>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <style>
    :root { --bg:#0f1420; --panel:#171e2e; --text:#e6e9f0; --muted:#8a93a8; --line:#2a3448; --accent:#4f8cff; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); display:grid; grid-template-columns:320px 1fr; height:100vh; }
    aside { background:var(--panel); border-right:1px solid var(--line); padding:20px; overflow-y:auto; }
    h1 { font-size:1.2rem; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 20px; font-size:.85rem; }
    h2 { font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:22px 0 8px; }
    input, select, button { width:100%; padding:9px 10px; margin-bottom:8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:.9rem; }
    button { background:var(--accent); border-color:var(--accent); cursor:pointer; font-weight:600; }
    button.secondary { background:transparent; border-color:var(--line); color:var(--muted); }
    button.danger { background:transparent; border-color:#c0495a; color:#e5768a; }
    #graph { height:100vh; }
    #msg { font-size:.82rem; min-height:1.2em; margin-top:6px; }
    #msg.err { color:#e5768a; } #msg.ok { color:#6fcf97; }
    .rec { font-size:.85rem; color:var(--muted); line-height:1.5; }
    @media (max-width: 800px) { body { grid-template-columns:1fr; grid-template-rows:auto 60vh; height:auto; } #graph { height:60vh; } }
  </style>
</head>
<body>
<aside>
  <h1>Campus Graph</h1>
  <p class="sub">Students, courses and teachers stored in Neo4j.</p>

  <h2>Add a node</h2>
  <select id="nodeLabel"><option>Student</option><option>Course</option><option>Teacher</option></select>
  <input id="nodeName" placeholder="Name" maxlength="60">
  <button onclick="addNode()">Add node</button>

  <h2>Connect two nodes</h2>
  <select id="relType">
    <option value="ENROLLED_IN">Student ENROLLED_IN Course</option>
    <option value="TEACHES">Teacher TEACHES Course</option>
    <option value="FRIEND_OF">Student FRIEND_OF Student</option>
  </select>
  <select id="relSource"></select>
  <select id="relTarget"></select>
  <button onclick="addRelationship()">Connect</button>

  <h2>Recommendations</h2>
  <select id="recStudent"></select>
  <button class="secondary" onclick="showRecommendations()">Courses my friends take</button>
  <div id="recOut" class="rec"></div>

  <h2>Selected node</h2>
  <button class="danger" onclick="deleteSelected()">Delete selected node</button>
  <button class="secondary" onclick="seed()">Load sample data</button>
  <div id="msg"></div>
</aside>
<div id="graph"></div>

<script>
const COLORS = { Student: "#4f8cff", Course: "#f2994a", Teacher: "#6fcf97" };
let network, nodes = [], selected = null;

const $ = (id) => document.getElementById(id);

function say(text, kind) { const m = $("msg"); m.textContent = text; m.className = kind || ""; }

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function fillSelect(select, items) {
  select.innerHTML = "";
  items.forEach((n) => select.add(new Option(`${n.name} (${n.label})`, n.id)));
}

async function load() {
  const data = await api("/api/graph");
  nodes = data.nodes;
  const graphData = {
    nodes: new vis.DataSet(data.nodes.map((n) => ({
      id: n.id, label: n.name, color: COLORS[n.label],
      font: { color: "#0f1420" }, shape: "box", margin: 8,
    }))),
    edges: new vis.DataSet(data.edges.map((e) => ({
      from: e.source, to: e.target, label: e.type,
      arrows: "to", font: { color: "#8a93a8", size: 10, strokeWidth: 0 },
      color: "#2a3448",
    }))),
  };
  network = new vis.Network($("graph"), graphData, { physics: { stabilization: true } });
  network.on("selectNode", (p) => { selected = p.nodes[0]; });
  network.on("deselectNode", () => { selected = null; });
  refreshSelects();
}

function refreshSelects() {
  const type = $("relType").value;
  const [src, dst] = {
    ENROLLED_IN: ["Student", "Course"],
    TEACHES: ["Teacher", "Course"],
    FRIEND_OF: ["Student", "Student"],
  }[type];
  fillSelect($("relSource"), nodes.filter((n) => n.label === src));
  fillSelect($("relTarget"), nodes.filter((n) => n.label === dst));
  fillSelect($("recStudent"), nodes.filter((n) => n.label === "Student"));
}
$("relType").addEventListener("change", refreshSelects);

async function addNode() {
  try {
    await api("/api/nodes", { method: "POST", body: JSON.stringify({ label: $("nodeLabel").value, name: $("nodeName").value }) });
    $("nodeName").value = ""; say("Node added", "ok"); await load();
  } catch (e) { say(e.message, "err"); }
}

async function addRelationship() {
  try {
    await api("/api/relationships", { method: "POST", body: JSON.stringify({ type: $("relType").value, source: $("relSource").value, target: $("relTarget").value }) });
    say("Connected", "ok"); await load();
  } catch (e) { say(e.message, "err"); }
}

async function deleteSelected() {
  if (!selected) return say("Click a node in the graph first", "err");
  if (!confirm("Delete this node and its relationships?")) return;
  try { await api("/api/nodes/" + encodeURIComponent(selected), { method: "DELETE" }); selected = null; say("Deleted", "ok"); await load(); }
  catch (e) { say(e.message, "err"); }
}

async function showRecommendations() {
  const id = $("recStudent").value;
  if (!id) return;
  try {
    const recs = await api("/api/recommendations/" + encodeURIComponent(id));
    $("recOut").textContent = recs.length
      ? recs.map((r) => `${r.course} (via ${r.friends.join(", ")})`).join(" · ")
      : "No recommendation: friends take no new courses.";
  } catch (e) { say(e.message, "err"); }
}

async function seed() {
  try { await api("/api/seed", { method: "POST" }); say("Sample data loaded", "ok"); await load(); }
  catch (e) { say(e.message, "err"); }
}

load().catch((e) => say(e.message, "err"));
</script>
</body>
</html>
